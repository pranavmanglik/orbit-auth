name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: orbit_auth
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/orbit-core
          path: orbit_core
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build 'setuptools>=83.0.0'
      - run: python -m pip install -e ./orbit_core
      - run: python -m pip install -e 'orbit_auth[dev]'
      - run: pip-audit --skip-editable --progress-spinner off
      - run: pytest
        working-directory: orbit_auth
      - run: ruff check src tests
        working-directory: orbit_auth
      - run: ruff format --check src tests
        working-directory: orbit_auth
      - run: mypy
        working-directory: orbit_auth
      - run: python -m build
        working-directory: orbit_auth
